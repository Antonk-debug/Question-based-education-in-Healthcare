<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Question Based Learning</title>
    <script>
      (() => {
        try {
          document.documentElement.dataset.theme = localStorage.getItem("adaptiveQuizTheme") || "light";
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <style>
:root {
  color-scheme: light;
  --bg: #f7f5ef;
  --surface: #ffffff;
  --surface-soft: #fbfaf6;
  --ink: #202326;
  --muted: #686f76;
  --line: #d9d4c8;
  --accent: #146c70;
  --accent-strong: #0f5659;
  --accent-soft: #dceeed;
  --gold: #c18425;
  --gold-soft: #fff0cf;
  --rose: #ba4148;
  --rose-soft: #f7dddd;
  --green: #23774f;
  --green-soft: #ddf0e5;
  --shadow: 0 18px 45px rgba(32, 35, 38, 0.12);
  --panel-bg: rgba(255, 255, 255, 0.9);
  --gate-bg: rgba(247, 245, 239, 0.84);
  --control-bg: #ffffff;
  --button-ink: #ffffff;
  --track-bg: #e7e1d5;
  --loader-track-bg: rgba(255, 255, 255, 0.72);
  --map-bg: #fbfaf6;
  --map-center: #ffffff;
  --map-link: rgba(32, 35, 38, 0.18);
  --map-correct: #23774f;
  --map-current: #d88a1d;
  --map-done: #e1bd35;
  --map-pending: #ba4148;
  --bg-wash-a: rgba(20, 108, 112, 0.08);
  --bg-wash-b: rgba(193, 132, 37, 0.12);
  --radius: 8px;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #090a10;
  --surface: #141722;
  --surface-soft: #10131d;
  --ink: #f2f5ff;
  --muted: #aab2c7;
  --line: #30364d;
  --accent: #7c8cff;
  --accent-strong: #b9c1ff;
  --accent-soft: #20264a;
  --gold: #d99a2b;
  --gold-soft: #3c2d15;
  --rose: #ff6b7a;
  --rose-soft: #3a1720;
  --green: #62d899;
  --green-soft: #173525;
  --shadow: 0 20px 52px rgba(0, 0, 0, 0.38);
  --panel-bg: rgba(20, 23, 34, 0.94);
  --gate-bg: rgba(9, 10, 16, 0.82);
  --control-bg: #161a27;
  --button-ink: #ffffff;
  --track-bg: #272d42;
  --loader-track-bg: rgba(16, 19, 29, 0.88);
  --map-bg: #0e111a;
  --map-center: #171b29;
  --map-link: rgba(185, 193, 255, 0.22);
  --map-correct: #62d899;
  --map-current: #a68cff;
  --map-done: #5f7cff;
  --map-pending: #ff6b7a;
  --bg-wash-a: rgba(124, 140, 255, 0.16);
  --bg-wash-b: rgba(98, 216, 153, 0.07);
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body {
  min-height: 100%;
  margin: 0;
  background:
    linear-gradient(135deg, var(--bg-wash-a), transparent 34%),
    linear-gradient(315deg, var(--bg-wash-b), transparent 30%),
    var(--bg);
  color: var(--ink);
  font-family:
    Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    sans-serif;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

body.access-locked {
  overflow: hidden;
}

.access-gate {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: grid;
  place-items: center;
  padding: 20px;
  background: var(--gate-bg);
  backdrop-filter: blur(10px);
}

.access-card {
  width: min(360px, 100%);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
  padding: 20px;
}

.access-card h2 {
  margin-bottom: 16px;
}

.access-card label {
  display: block;
  margin-bottom: 6px;
  color: var(--muted);
  font-size: 0.84rem;
  font-weight: 800;
}

.access-card input {
  width: 100%;
  min-height: 42px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface-soft);
  color: var(--ink);
  padding: 0 10px;
  outline: none;
}

.access-card input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(20, 108, 112, 0.14);
}

.access-error {
  min-height: 20px;
  margin: 10px 0;
  color: var(--rose);
  font-size: 0.9rem;
}

.access-card button {
  width: 100%;
}

.app-shell {
  width: min(1500px, calc(100vw - 32px));
  margin: 0 auto;
  padding: 24px 0 36px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 10px 0 22px;
}

.brand-block {
  display: grid;
  gap: 8px;
  min-width: 0;
}

h1,
h2,
h3,
p {
  margin: 0;
}

h1 {
  font-size: clamp(2rem, 4vw, 4.5rem);
  line-height: 0.95;
  letter-spacing: 0;
}

.app-subtitle {
  max-width: 820px;
  color: var(--accent);
  font-size: clamp(1rem, 1.4vw, 1.22rem);
  font-style: italic;
  font-weight: 750;
  line-height: 1.35;
}

h2,
h3 {
  font-size: 1rem;
  letter-spacing: 0;
}

.theme-toggle {
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel-bg);
  color: var(--ink);
  padding: 0 14px;
  font-size: 0.9rem;
  font-weight: 850;
  box-shadow: 0 10px 28px rgba(32, 35, 38, 0.08);
  transition:
    border-color 160ms ease,
    background 160ms ease,
    color 160ms ease,
    transform 160ms ease;
}

.theme-toggle:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
}

.theme-toggle-mark {
  width: 18px;
  height: 18px;
  border: 2px solid var(--accent);
  border-radius: 50%;
  background: linear-gradient(90deg, var(--accent) 0 50%, transparent 50% 100%);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.eyebrow {
  margin-bottom: 6px;
  color: var(--accent);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.score-pill {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel-bg);
  padding: 16px 18px;
  display: grid;
  place-items: center;
  text-align: center;
  box-shadow: 0 10px 28px rgba(32, 35, 38, 0.08);
}

.score-pill span {
  color: var(--ink);
  font-size: 1rem;
  font-weight: 900;
}

.workspace {
  display: grid;
  grid-template-columns: minmax(280px, 0.85fr) minmax(420px, 1.3fr) minmax(280px, 0.85fr);
  gap: 18px;
  align-items: start;
}

.source-panel,
.quiz-panel,
.insight-panel {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel-bg);
  box-shadow: var(--shadow);
}

.source-panel,
.map-column {
  position: sticky;
  top: 20px;
}

.map-column {
  display: grid;
  gap: 12px;
}

.source-panel,
.quiz-panel {
  padding: 18px;
}

.insight-panel {
  padding: 18px 18px 20px;
}

.panel-heading,
.report-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 14px;
}

textarea {
  width: 100%;
  min-height: 420px;
  max-height: 62vh;
  resize: vertical;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface-soft);
  color: var(--ink);
  line-height: 1.5;
  padding: 14px;
  outline: none;
}

textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(20, 108, 112, 0.14);
}

.ai-panel {
  display: grid;
  gap: 10px;
  margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface-soft);
  padding: 12px;
}

.toggle-row,
.remember-row {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--ink);
  font-weight: 850;
}

.toggle-row input,
.remember-row input {
  width: 18px;
  height: 18px;
  accent-color: var(--accent);
}

.ai-fields {
  display: grid;
  gap: 10px;
  border-top: 1px solid var(--line);
  padding-top: 10px;
}

.ai-fields label:not(.remember-row) {
  display: grid;
  gap: 6px;
  color: var(--muted);
  font-size: 0.84rem;
  font-weight: 800;
}

.ai-fields input[type="password"],
.ai-fields input[type="text"],
.ai-fields input[type="url"],
.ai-fields select {
  width: 100%;
  min-height: 40px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--control-bg);
  color: var(--ink);
  padding: 0 10px;
  outline: none;
}

.ai-fields input[type="password"]:focus,
.ai-fields input[type="text"]:focus,
.ai-fields input[type="url"]:focus,
.ai-fields select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(20, 108, 112, 0.14);
}

.source-actions,
.quiz-actions,
.next-actions,
.question-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 14px;
}

.question-nav {
  margin-top: 0;
  justify-content: flex-end;
}

.primary-button,
.ghost-button,
.text-button {
  min-height: 42px;
  border-radius: var(--radius);
  padding: 0 16px;
  font-weight: 800;
  transition:
    transform 160ms ease,
    background 160ms ease,
    color 160ms ease,
    border-color 160ms ease;
}

.primary-button {
  background: var(--accent);
  color: var(--button-ink);
}

.primary-button:hover:not(:disabled) {
  background: var(--accent-strong);
  transform: translateY(-1px);
}

.ghost-button {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
}

.ghost-button:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent-strong);
  transform: translateY(-1px);
}

.text-button {
  background: transparent;
  color: var(--muted);
}

.text-button:hover:not(:disabled) {
  color: var(--rose);
}

.status-message {
  min-height: 22px;
  margin-top: 12px;
  color: var(--rose);
  font-size: 0.9rem;
  line-height: 1.35;
}

.status-message.success {
  color: var(--green);
}

.generation-loader {
  display: grid;
  gap: 8px;
  margin-top: 14px;
  border: 1px solid rgba(20, 108, 112, 0.24);
  border-radius: var(--radius);
  background: var(--accent-soft);
  padding: 12px;
}

.loader-copy {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  color: var(--accent-strong);
  font-size: 0.88rem;
  font-weight: 850;
}

.loader-track {
  height: 10px;
  border-radius: 999px;
  background: var(--loader-track-bg);
  overflow: hidden;
}

.loader-track span {
  display: block;
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--gold), var(--accent));
  transition: width 220ms ease;
}

.knowledge-bank {
  display: grid;
  gap: 10px;
  margin-bottom: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface-soft);
  padding: 14px;
}

.knowledge-bank h3 {
  color: var(--accent-strong);
}

.knowledge-bank p {
  color: var(--ink);
  line-height: 1.5;
}

.empty-state {
  min-height: 430px;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 20px;
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  background: var(--surface-soft);
  color: var(--muted);
  text-align: center;
  padding: 30px;
}

.empty-visual {
  width: min(240px, 62vw);
  aspect-ratio: 1.6;
  position: relative;
}

.empty-visual span {
  position: absolute;
  display: block;
  border: 2px solid var(--line);
  border-radius: var(--radius);
  background: var(--control-bg);
}

.empty-visual span:nth-child(1) {
  width: 54%;
  height: 48%;
  left: 0;
  top: 8%;
}

.empty-visual span:nth-child(2) {
  width: 58%;
  height: 54%;
  right: 0;
  top: 24%;
  border-color: rgba(20, 108, 112, 0.35);
}

.empty-visual span:nth-child(3) {
  width: 34%;
  height: 34%;
  left: 33%;
  bottom: 0;
  border-color: rgba(193, 132, 37, 0.45);
}

.question-stack {
  display: grid;
  gap: 14px;
}

.question-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 16px;
}

.question-stack-leave-forward .question-card,
.question-stack-leave-backward .question-card {
  pointer-events: none;
}

.question-stack-leave-forward .question-card {
  animation: questionLeaveForward 130ms ease forwards;
}

.question-stack-leave-backward .question-card {
  animation: questionLeaveBackward 130ms ease forwards;
}

.question-card-enter-forward {
  animation: questionEnterForward 180ms ease both;
}

.question-card-enter-backward {
  animation: questionEnterBackward 180ms ease both;
}

@keyframes questionLeaveForward {
  from {
    opacity: 1;
    transform: translateX(0);
  }

  to {
    opacity: 0;
    transform: translateX(-12px);
  }
}

@keyframes questionLeaveBackward {
  from {
    opacity: 1;
    transform: translateX(0);
  }

  to {
    opacity: 0;
    transform: translateX(12px);
  }
}

@keyframes questionEnterForward {
  from {
    opacity: 0;
    transform: translateX(14px);
  }

  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@keyframes questionEnterBackward {
  from {
    opacity: 0;
    transform: translateX(-14px);
  }

  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@media (prefers-reduced-motion: reduce) {
  .question-stack-leave-forward .question-card,
  .question-stack-leave-backward .question-card,
  .question-card-enter-forward,
  .question-card-enter-backward {
    animation: none;
  }
}

.question-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  color: var(--muted);
  font-size: 0.82rem;
}

.area-chip {
  display: inline-flex;
  align-items: center;
  min-height: 26px;
  max-width: 100%;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface-soft);
  padding: 0 10px;
  color: var(--accent-strong);
  font-weight: 800;
  overflow-wrap: anywhere;
}

.question-card legend {
  width: 100%;
  margin-bottom: 12px;
  padding: 0;
  color: var(--ink);
  font-size: 1.04rem;
  font-weight: 760;
  line-height: 1.35;
}

:root[data-theme="dark"] .question-card legend {
  color: #e3e8ff;
  text-shadow: none;
  -webkit-font-smoothing: antialiased;
}

fieldset {
  min-width: 0;
  margin: 0;
  border: 0;
  padding: 0;
}

.option-grid {
  display: grid;
  gap: 9px;
}

.option-row {
  min-height: 52px;
  display: grid;
  grid-template-columns: 34px 1fr;
  align-items: start;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface-soft);
  padding: 10px;
  transition:
    border-color 150ms ease,
    background 150ms ease,
    transform 150ms ease;
}

.option-row:hover {
  border-color: rgba(20, 108, 112, 0.5);
  transform: translateY(-1px);
}

.option-row.locked {
  cursor: default;
}

.option-row.locked:hover {
  border-color: var(--line);
  transform: none;
}

.option-row.locked:has(input:checked),
.option-row.locked:has(input:checked):hover {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.option-row input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.option-letter {
  width: 32px;
  height: 32px;
  border: 1px solid var(--line);
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--control-bg);
  color: var(--muted);
  font-weight: 900;
}

.option-row span:last-child {
  align-self: center;
  line-height: 1.42;
  overflow-wrap: anywhere;
}

.option-row:has(input:checked) {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.option-row:has(input:checked) .option-letter {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--button-ink);
}

.option-feedback {
  margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface-soft);
  padding: 12px;
  color: var(--ink);
  line-height: 1.45;
}

.answer-lock-note {
  margin-bottom: 8px;
  color: var(--muted);
  font-size: 0.9rem;
  font-weight: 800;
}

.option-feedback.correct {
  border-color: rgba(35, 119, 79, 0.45);
  background: var(--green-soft);
}

.option-feedback.wrong {
  border-color: rgba(186, 65, 72, 0.42);
  background: var(--rose-soft);
}

.progress-wrap {
  width: min(360px, 100%);
  display: grid;
  gap: 7px;
  color: var(--muted);
  font-size: 0.86rem;
  font-weight: 700;
}

.progress-track {
  height: 9px;
  border-radius: 999px;
  background: var(--track-bg);
  overflow: hidden;
}

.progress-track span {
  display: block;
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--gold), var(--accent));
  transition: width 180ms ease;
}

.report {
  margin-top: 18px;
  border-top: 1px solid var(--line);
  padding-top: 18px;
}

.report-heading strong {
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent-strong);
  padding: 8px 12px;
}

.weak-area-summary {
  margin-bottom: 12px;
  border: 1px solid rgba(186, 65, 72, 0.24);
  border-radius: var(--radius);
  background: var(--rose-soft);
  color: var(--ink);
  font-size: 0.94rem;
  line-height: 1.42;
  padding: 10px 12px;
}

.map-weak-summary {
  min-height: 42px;
  margin-top: 0;
}

.weak-area-summary.mastered {
  border-color: rgba(35, 119, 79, 0.28);
  background: var(--green-soft);
}

.feedback-list {
  display: grid;
  gap: 10px;
}

.feedback-item {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  background: var(--surface-soft);
}

.feedback-item.correct {
  border-color: rgba(35, 119, 79, 0.4);
  background: var(--green-soft);
}

.feedback-item.wrong {
  border-color: rgba(186, 65, 72, 0.38);
  background: var(--rose-soft);
}

.feedback-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
  font-weight: 900;
}

.feedback-title span {
  overflow-wrap: anywhere;
}

.feedback-item p {
  color: var(--ink);
  font-size: 0.93rem;
  line-height: 1.45;
}

.feedback-item small {
  display: block;
  margin-top: 8px;
  color: var(--muted);
  line-height: 1.4;
}

#masteryCanvas {
  width: 100%;
  aspect-ratio: 1.42;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--map-bg);
}

.map-snapshots {
  min-height: 58px;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: flex-start;
  gap: 8px;
  margin: 0 0 12px;
}

.map-snapshot {
  width: 54px;
  height: 54px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--map-bg);
}

.area-list {
  display: grid;
  gap: 8px;
  margin-top: 14px;
}

.area-row {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--line);
  padding: 9px 0;
  font-size: 0.9rem;
}

.area-row:last-child {
  border-bottom: 0;
}

.area-row strong {
  overflow-wrap: anywhere;
}

.area-row span {
  color: var(--muted);
  white-space: nowrap;
}

.focus-box {
  margin-top: 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface-soft);
  padding: 14px;
}

.focus-box strong {
  display: block;
  margin-bottom: 8px;
  overflow-wrap: anywhere;
}

    <script>
(function (root, factory) {
  const api = factory();
  if (typeof module === "object" && module.exports) {
    module.exports = api;
  }
  root.QuizEngine = api;
})(typeof window !== "undefined" ? window : globalThis, function () {
  "use strict";

  const STOP_WORDS = new Set([
    "about",
    "above",
    "after",
    "again",
    "against",
    "also",
    "although",
    "always",
    "among",
    "because",
    "been",
    "before",
    "being",
    "between",
    "both",
    "cannot",
    "could",
    "during",
    "each",
    "early",
    "every",
    "from",
    "have",
    "having",
    "into",
    "itself",
    "just",
    "like",
    "many",
    "more",
    "most",
    "much",
    "must",
    "only",
    "other",
    "over",
    "same",
    "should",
    "some",
    "such",
    "than",
    "that",
    "their",
    "them",
    "then",
    "there",
    "these",
    "they",
    "this",
    "those",
    "through",
    "under",
    "until",
    "very",
    "what",
    "when",
    "where",
    "which",
    "while",
    "will",
    "with",
    "within",
    "without",
    "would",
  ]);

  const RELATION_WORDS = [
    "absorbs",
    "causes",
    "cause",
    "converts",
    "leads to",
    "results in",
    "produces",
    "uses",
    "use",
    "allows",
    "helps",
    "prevents",
    "reduces",
    "increases",
    "requires",
    "depends on",
    "supports",
    "controls",
    "regulates",
    "explains",
  ];

  const DEFINITION_WORDS = [
    "is defined as",
    "are defined as",
    "can be defined as",
    "refers to",
    "means",
    "is",
    "are",
    "was",
    "were",
  ];

  function createSession(text, config) {
    const cleanText = normalizeText(text);
    const sentences = splitSentences(cleanText);
    const keywordCounts = countKeywords(sentences);
    const facts = sentences
      .map((sentence, index) => buildFact(sentence, index, keywordCounts))
      .filter(Boolean)
      .sort((a, b) => b.score - a.score);

    const usableFacts = dedupeFacts(facts).slice(0, 18);

    if (!usableFacts.length) {
      return {
        text: cleanText,
        hash: hashString(cleanText || "empty"),
        facts: [],
        areas: [],
        config: Object.assign({ roundSize: 5 }, config || {}),
      };
    }

    const areas = buildAreas(usableFacts);

    return {
      text: cleanText,
      hash: hashString(cleanText),
      facts: usableFacts,
      areas,
      config: Object.assign({ roundSize: 5 }, config || {}),
    };
  }

  function generateRound(session, options) {
    if (!session?.facts?.length) return [];

    const settings = Object.assign(
      { weakAreas: [], roundIndex: 1, previousQuestionIds: [], roundSize: 5 },
      options || {},
    );
    const seed = session.hash + settings.roundIndex * 997;
    const rng = mulberry32(seed);
    const weakSet = new Set((settings.weakAreas || []).map(normalizeKey));
    const previousIds = new Set(settings.previousQuestionIds || []);

    let pool = session.facts;
    if (weakSet.size) {
      const focused = session.facts.filter((fact) => {
        if (weakSet.has(normalizeKey(fact.area))) return true;
        return fact.keywords.some((keyword) => weakSet.has(normalizeKey(keyword)));
      });
      if (focused.length) pool = focused;
    }

    const ordered = shuffle(pool, rng);
    const questions = [];
    const target = Math.max(1, settings.roundSize || session.config.roundSize || 5);
    let safety = 0;

    while (questions.length < target && safety < target * 8) {
      const fact = ordered[safety % ordered.length] || session.facts[safety % session.facts.length];
      const variant = (settings.roundIndex + safety + fact.index) % 5;
      const question = buildQuestion(fact, session.facts, {
        seed: seed + safety * 131,
        roundIndex: settings.roundIndex,
        variant,
      });

      if (!previousIds.has(question.id) || weakSet.size || questions.length >= pool.length) {
        if (!questions.some((item) => item.id === question.id)) {
          questions.push(question);
        }
      }
      safety += 1;
    }

    return questions;
  }

  function gradeRound(questions, answers) {
    const perArea = {};
    const items = questions.map((question) => {
      const chosenId = answers[question.id];
      const chosen = question.options.find((option) => option.id === chosenId);
      const correctOption = question.options.find((option) => option.id === question.answerId);
      const isCorrect = chosenId === question.answerId;

      if (!perArea[question.area]) {
        perArea[question.area] = { area: question.area, asked: 0, correct: 0, wrong: 0 };
      }
      perArea[question.area].asked += 1;
      perArea[question.area][isCorrect ? "correct" : "wrong"] += 1;

      return {
        id: question.id,
        area: question.area,
        prompt: question.prompt,
        chosen: chosen ? chosen.text : "",
        correct: correctOption ? correctOption.text : "",
        isCorrect,
        feedback: chosen?.feedback || question.explanation || "",
        explanation: question.explanation,
        source: question.source,
        difficulty: question.difficulty,
        targetedMisconception: question.targetedMisconception,
      };
    });

    const correctCount = items.filter((item) => item.isCorrect).length;
    const weakAreas = Object.values(perArea)
      .filter((area) => area.wrong > 0)
      .sort((a, b) => b.wrong - a.wrong || a.area.localeCompare(b.area))
      .map((area) => area.area);

    return {
      total: questions.length,
      correct: correctCount,
      wrong: questions.length - correctCount,
      items,
      perArea,
      weakAreas,
      mastered: correctCount === questions.length,
    };
  }

  function normalizeText(text) {
    return String(text || "")
      .replace(/\r/g, "\n")
      .replace(/[ \t]+/g, " ")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }

  function splitSentences(text) {
    const normalized = normalizeText(text)
      .replace(/^[\s>*-]*(?:\d+[.)]\s*)?/gm, "")
      .replace(/[•·]/g, "\n");
    const lineCandidates = normalized
      .split(/\n+/)
      .map((line) => cleanSentence(line))
      .filter(Boolean);
    const punctuationCandidates =
      normalized
        .replace(/\n+/g, ". ")
        .match(/[^.!?]+(?:[.!?]+|$)/g)
        ?.map((sentence) => cleanSentence(sentence)) || [];

    const candidates = lineCandidates.concat(punctuationCandidates);
    const pieces = candidates.flatMap(splitCandidate);
    const seen = new Set();

    return pieces.filter((sentence) => {
      const key = normalizeKey(sentence);
      if (wordCount(sentence) < 4 || seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }

  function splitCandidate(sentence) {
    const clean = cleanSentence(sentence);
    const words = wordCount(clean);
    if (!clean || words < 4) return [];
    if (words <= 55) return [clean];

    const clausePieces = clean
      .split(/(?:;|:|\s+-\s+|\s+\|\s+|\s+\band\b\s+|\s+\bbut\b\s+|\s+\bwhile\b\s+|\s+\bwhereas\b\s+)/i)
      .map((piece) => cleanSentence(piece))
      .filter((piece) => wordCount(piece) >= 4 && wordCount(piece) <= 55);

    if (clausePieces.length >= 2) return clausePieces;
    return chunkLongSentence(clean);
  }

  function chunkLongSentence(sentence) {
    const words = sentence.match(/[A-Za-z0-9]+(?:[-'][A-Za-z0-9]+)*|[^\sA-Za-z0-9]/g) || [];
    const chunks = [];
    const maxWords = 34;
    const overlap = 5;
    let wordSeen = 0;
    let startToken = 0;

    for (let index = 0; index < words.length; index += 1) {
      if (/^[A-Za-z0-9]/.test(words[index])) wordSeen += 1;
      if (wordSeen >= maxWords || index === words.length - 1) {
        const chunk = cleanSentence(words.slice(startToken, index + 1).join(" ").replace(/\s+([,.;:!?])/g, "$1"));
        if (wordCount(chunk) >= 4) chunks.push(chunk);
        const rewind = Math.max(0, index - overlap * 2);
        startToken = rewind;
        wordSeen = 0;
      }
    }

    return chunks;
  }

  function cleanSentence(sentence) {
    return String(sentence || "")
      .replace(/\s+/g, " ")
      .replace(/^[-*]\s*/, "")
      .trim();
  }

  function wordCount(text) {
    return (String(text).match(/[A-Za-z0-9]+(?:[-'][A-Za-z0-9]+)*/g) || []).length;
  }

  function tokenize(text) {
    return (String(text).toLowerCase().match(/[a-z][a-z'-]{2,}|\d+(?:\.\d+)?%?/g) || []).filter(
      (token) => !STOP_WORDS.has(token) && token.length > 2,
    );
  }

  function countKeywords(sentences) {
    const counts = new Map();
    sentences.forEach((sentence) => {
      new Set(tokenize(sentence)).forEach((token) => {
        counts.set(token, (counts.get(token) || 0) + 1);
      });
    });
    return counts;
  }

  function buildFact(sentence, index, keywordCounts) {
    const words = wordCount(sentence);
    if (words < 4) return null;

    const definition = extractDefinition(sentence);
    const relation = extractRelation(sentence);
    const list = extractList(sentence);
    const keywords = rankKeywords(sentence, keywordCounts);
    const area = chooseArea(sentence, definition, relation, list, keywords);
    const score =
      words +
      (definition ? 26 : 0) +
      (relation ? 18 : 0) +
      (list ? 14 : 0) +
      Math.min(18, keywords.length * 4) +
      (/\d|%/.test(sentence) ? 8 : 0);

    return {
      id: `fact-${index}-${hashString(sentence)}`,
      index,
      sentence,
      source: sentence,
      definition,
      relation,
      list,
      keywords,
      area,
      score,
    };
  }

  function extractDefinition(sentence) {
    const escaped = DEFINITION_WORDS.map(escapeRegExp).join("|");
    const pattern = new RegExp(`^(.{2,90}?)\\s+(${escaped})\\s+(.{8,})$`, "i");
    const match = sentence.match(pattern);
    if (!match) return null;

    const term = cleanTerm(match[1]);
    const definition = stripTrailing(cleanSentence(match[3]));
    if (!term || !definition || wordCount(term) > 8 || isBadDefinitionSubject(match[1])) {
      return null;
    }
    if (/^(split|released|produced|absorbed|converted|used|stored|called|known)\b/i.test(definition)) {
      return null;
    }

    return {
      term,
      connector: match[2].toLowerCase(),
      definition,
    };
  }

  function extractRelation(sentence) {
    const escaped = RELATION_WORDS.map(escapeRegExp).join("|");
    const pattern = new RegExp(`^(.{2,90}?)\\s+(${escaped})\\s+(.{5,})$`, "i");
    const match = sentence.match(pattern);
    if (!match) return null;

    return {
      subject: cleanTerm(match[1]),
      verb: match[2].toLowerCase(),
      object: stripTrailing(cleanSentence(match[3])),
    };
  }

  function extractList(sentence) {
    const pattern = /^(.{2,90}?)\s+(includes|include|contains|contain|consists of|consist of|is made of|are made of|has|have)\s+(.{5,})$/i;
    const match = sentence.match(pattern);
    if (!match) return null;

    return {
      subject: cleanTerm(match[1]),
      verb: match[2].toLowerCase(),
      members: stripTrailing(cleanSentence(match[3])),
    };
  }

  function rankKeywords(sentence, keywordCounts) {
    return tokenize(sentence)
      .map((token) => ({
        token,
        score: token.length + Math.max(0, 8 - (keywordCounts.get(token) || 1)),
      }))
      .sort((a, b) => b.score - a.score)
      .map((item) => item.token)
      .filter((token, index, arr) => arr.indexOf(token) === index)
      .slice(0, 8);
  }

  function chooseArea(sentence, definition, relation, list, keywords) {
    if (definition?.term) return titleCase(definition.term);
    if (relation?.subject && !isBadDefinitionSubject(relation.subject)) {
      return titleCase(relation.subject);
    }
    if (list?.subject && !isBadDefinitionSubject(list.subject)) {
      return titleCase(list.subject);
    }

    const contextLead = sentence.match(/^(?:In|During|Within)\s+(?:the\s+)?([^,]{3,70}),/i);
    if (contextLead) return titleCase(trimConditionPhrase(contextLead[1]));

    const conditionLead = sentence.match(/^(?:When|If|Because|Although|While)\s+([^,]{3,70}),/i);
    if (conditionLead) return titleCase(trimConditionPhrase(conditionLead[1]));

    const subjectLead = sentence.match(
      /^(.{2,70}?)\s+(?:can|usually|often|must|will|may|might|should|balances|balance|contains|contain|includes|include|supports|support)\b/i,
    );
    if (subjectLead && !isBadDefinitionSubject(subjectLead[1])) {
      return titleCase(cleanTerm(subjectLead[1]));
    }

    const capitalPhrase = sentence.match(/\b[A-Z][a-z]+(?:\s+[A-Z][a-z]+){0,2}\b/);
    if (capitalPhrase && wordCount(capitalPhrase[0]) <= 3) {
      return capitalPhrase[0];
    }

    return titleCase((keywords[0] || "Core concept").replace(/-/g, " "));
  }

  function isBadDefinitionSubject(subject) {
    const clean = cleanSentence(subject);
    const first = clean.split(/\s+/)[0]?.toLowerCase();
    return (
      !clean ||
      /[,;:]/.test(clean) ||
      /\b(which|that|who|where)\b/i.test(clean) ||
      wordCount(clean) > 7 ||
      ["in", "when", "if", "because", "although", "while", "during", "after", "before"].includes(first)
    );
  }

  function trimConditionPhrase(phrase) {
    return cleanTerm(phrase).replace(
      /\s+(increases|decreases|rises|falls|changes|occurs|happens|becomes|starts|ends)$/i,
      "",
    );
  }

  function buildAreas(facts) {
    const areaMap = new Map();
    facts.forEach((fact) => {
      if (!areaMap.has(fact.area)) {
        areaMap.set(fact.area, { name: fact.area, count: 0, keywords: new Set() });
      }
      const area = areaMap.get(fact.area);
      area.count += 1;
      fact.keywords.slice(0, 4).forEach((keyword) => area.keywords.add(keyword));
    });

    return Array.from(areaMap.values())
      .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name))
      .map((area) => ({
        name: area.name,
        count: area.count,
        keywords: Array.from(area.keywords).slice(0, 6),
      }));
  }

  function dedupeFacts(facts) {
    const seen = new Set();
    return facts.filter((fact) => {
      const key = normalizeKey(fact.sentence.replace(/\d+/g, "#"));
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }

  function buildQuestion(fact, allFacts, settings) {
    if (settings.variant === 4) {
      return areaQuestion(fact, allFacts, settings);
    }
    if (fact.definition && settings.variant === 0) {
      return definitionQuestion(fact, allFacts, settings);
    }
    if (fact.relation && settings.variant === 1) {
      return relationQuestion(fact, allFacts, settings);
    }
    if (settings.variant === 2 || fact.list) {
      return clozeQuestion(fact, allFacts, settings);
    }
    return claimQuestion(fact, allFacts, settings);
  }

  function areaQuestion(fact, allFacts, settings) {
    const correct = fact.area;
    const prompt = `Which study area does this detail most directly test? "${shorten(fact.sentence, 170)}"`;
    const distractors = allFacts
      .filter((other) => other.id !== fact.id)
      .flatMap((other) => [other.area, ...other.keywords.slice(0, 2).map(titleCase)]);

    return makeQuestion({
      fact,
      type: "area",
      prompt,
      correct,
      distractors,
      settings,
      explanation: `This detail is mainly tied to ${fact.area}.`,
    });
  }

  function definitionQuestion(fact, allFacts, settings) {
    const correct = fact.definition.definition;
    const prompt = `Which option best explains ${fact.definition.term}?`;
    const distractors = [
      ...allFacts
        .filter((other) => other.id !== fact.id)
        .map(factAnswerText),
      changeKeyDetail(correct, fact, allFacts),
      reverseClaim(correct),
      absolutizeClaim(correct),
    ];

    return makeQuestion({
      fact,
      type: "definition",
      prompt,
      correct,
      distractors,
      settings,
      explanation: `${fact.definition.term} is described in the text as ${lowerFirst(correct)}`,
    });
  }

  function relationQuestion(fact, allFacts, settings) {
    const relation = fact.relation;
    const prompt = `According to the text, what does ${relation.subject} ${relation.verb}?`;
    const correct = relation.object;
    const distractors = [
      ...allFacts
        .filter((other) => other.id !== fact.id)
        .map((other) => other.relation?.object || other.list?.members || getKeyPhrase(other)),
      reverseClaim(`${relation.subject} ${relation.verb} ${relation.object}`),
      changeKeyDetail(correct, fact, allFacts),
      ...allFacts.filter((other) => other.id !== fact.id).map(factAnswerText),
    ];

    return makeQuestion({
      fact,
      type: "relationship",
      prompt,
      correct,
      distractors,
      settings,
      explanation: `The relationship in the source is: ${relation.subject} ${relation.verb} ${relation.object}`,
    });
  }

  function clozeQuestion(fact, allFacts, settings) {
    const phrase = chooseBlankPhrase(fact);
    const promptSentence = blankPhrase(fact.sentence, phrase);
    const prompt = `Which option best completes this sentence? "${promptSentence}"`;
    const distractors = [
      ...allFacts.filter((other) => other.id !== fact.id).map(getKeyPhrase),
      ...allFacts
        .filter((other) => other.id !== fact.id)
        .flatMap((other) => other.keywords.slice(0, 2).map(titleCase)),
      changeKeyDetail(phrase, fact, allFacts),
      reversePhrase(phrase),
    ];

    return makeQuestion({
      fact,
      type: "completion",
      prompt,
      correct: phrase,
      distractors,
      settings,
      explanation: `The missing phrase is taken from the source sentence about ${fact.area}.`,
    });
  }

  function claimQuestion(fact, allFacts, settings) {
    const prompt = `Which statement best matches the source's point about ${fact.area}?`;
    const correct = stripTrailing(fact.sentence);
    const distractors = [
      reverseClaim(correct),

    ctx.stroke();

    ctx.fillStyle = colors.accent;
    ctx.font = "900 13px Inter, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("Score", centerX, centerY - 7);
    ctx.fillStyle = colors.ink;
    ctx.font = "800 15px Inter, system-ui, sans-serif";
    const currentResult = getCurrentRoundResult();
    ctx.fillText(currentResult ? `${currentResult.correct}/${currentResult.total}` : `0/${nodes.length}`, centerX, centerY + 12);
  }

  function getMasteryNodes() {
    if (state.questions.length) {
      const currentResult = getCurrentRoundResult();
      return state.questions.map((question, index) => {
        const resultItem = currentResult?.items?.find((item) => item.id === question.id);
        return {
          status: resultItem
            ? resultItem.isCorrect
              ? "correct"
              : "wrong"
            : index === state.currentQuestionIndex
              ? "current"
              : state.answers[question.id]
                ? "done"
                : "pending",
        };
      });
    }

    return (state.session?.areas || []).slice(0, state.roundSize).map(() => ({
      status: "pending",
    }));
  }

  function getCurrentRoundResult() {
    const latest = state.history[state.history.length - 1];
    if (!latest?.items?.length || !state.questions.length) return null;

    const currentIds = new Set(state.questions.map((question) => question.id));
    return latest.items.every((item) => currentIds.has(item.id)) ? latest : null;
  }

  function drawEmptyCanvas(ctx, width, height, colors) {
    ctx.strokeStyle = colors.line;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(width / 2, height / 2, Math.min(width, height) * 0.22, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = colors.muted;
    ctx.font = "800 14px Inter, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("No map yet", width / 2, height / 2);
  }

  function getThemeColors() {
    return {
      mapBg: cssVar("--map-bg"),
      mapCenter: cssVar("--map-center"),
      mapLink: cssVar("--map-link"),
      line: cssVar("--line"),
      accent: cssVar("--accent"),
      ink: cssVar("--ink"),
      muted: cssVar("--muted"),
      correct: cssVar("--map-correct"),
      current: cssVar("--map-current"),
      done: cssVar("--map-done"),
      pending: cssVar("--map-pending"),
    };
  }

  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function updateMastery(result) {
    Object.values(result.perArea).forEach((area) => {
      if (!state.mastery[area.area]) {
        state.mastery[area.area] = { asked: 0, correct: 0, wrong: 0 };
      }
      state.mastery[area.area].asked += area.asked;
      state.mastery[area.area].correct += area.correct;
      state.mastery[area.area].wrong += area.wrong;
      if (area.wrong === 0) {
        state.mastery[area.area].wrong = 0;
      }
    });
  }

  function resetQuiz(options = {}) {
    state.session = null;
    state.questions = [];
    state.answers = {};
    state.lockedAnswers = {};
    state.currentQuestionIndex = 0;
    clearTimeout(state.advanceTimer);
    clearTimeout(state.transitionTimer);
    state.isTransitioning = false;
    state.roundIndex = 1;
    state.history = [];
    state.mastery = {};
    state.weakAreas = [];
    state.previousQuestionIds = [];
    state.aiMode = false;
    state.aiModelUsed = "";
    state.sourceText = "";
    state.knowledgeBank = "";
    state.course = "";
    state.learningGoals = [];
    state.skills = [];
    state.roundSize = QBL_QUESTION_COUNT;

    if (options.clearSource) {
      els.sourceText.value = "";
    }

    els.roundLabel.textContent = "Round 1";
    els.emptyState.classList.remove("hidden");
    els.quizForm.classList.add("hidden");
    els.quizActions.classList.add("hidden");
    els.report.classList.add("hidden");
    els.feedbackList.innerHTML = "";
    if (els.knowledgeBank) els.knowledgeBank.classList.add("hidden");
    if (els.knowledgeBankText) els.knowledgeBankText.textContent = "";
    els.reportScore.textContent = "";
    els.progressText.textContent = "0 of 0 answered";
    els.progressBar.style.width = "0%";
    els.submitButton.disabled = true;
    els.submitButton.classList.remove("hidden");
    els.nextQuestionButton.classList.remove("hidden");
    els.nextRoundButton.classList.add("hidden");
    clearWeakAreaSummary();
    els.editButton.classList.add("hidden");
    els.quizForm.innerHTML = "";
    hideLoading();
    if (options.clearStatusMessage) {
      clearStatus();
    }
    renderInsights();
  }

  async function initializeAccessGate() {
    try {
      const config = await window.AiQuizService.getConfig();
      state.accessRequired = Boolean(config.accessRequired);
      if (state.accessRequired && !window.AiQuizService.getAccessCode()) {
        showAccessGate();
      }
    } catch (error) {
      state.accessRequired = false;
    }
  }

  async function verifyAccessCode() {
    const accessCode = els.accessCodeInput.value.trim();
    if (!accessCode) {
      els.accessError.textContent = "Enter the access code.";
      return;
    }

    els.accessSubmitButton.disabled = true;
    els.accessSubmitButton.textContent = "Checking";

    try {
      await window.AiQuizService.verifyAccessCode(accessCode);
      hideAccessGate();
      clearStatus();
    } catch (error) {
      els.accessError.textContent = error.message || "Access code is incorrect.";
      els.accessCodeInput.select();
    } finally {
      els.accessSubmitButton.disabled = false;
      els.accessSubmitButton.textContent = "Continue";
    }
  }

  function showAccessGate(message) {
    if (!els.accessGate) return;
    els.accessError.textContent = message || "";
    els.accessGate.classList.remove("hidden");
    document.body.classList.add("access-locked");
    setTimeout(() => els.accessCodeInput.focus(), 0);
  }

  function hideAccessGate() {
    if (!els.accessGate) return;
    els.accessError.textContent = "";
    els.accessGate.classList.add("hidden");
    document.body.classList.remove("access-locked");
  }

  function showStatus(message, tone) {
    els.statusMessage.classList.toggle("success", tone === "success");
    els.statusMessage.textContent = message;
  }

  function getSuccessMessage() {
    if (state.aiMode) {
      return `Built a QBL knowledge bank and ${state.questions.length} questions with ${formatModelName(state.aiModelUsed || "Gemini")}.`;
    }

    const count = state.session?.facts?.length || 0;
    return `Built ${state.questions.length} questions from ${count} study point${count === 1 ? "" : "s"}.`;
  }

  function getQuestionCountForText(text) {
    return QBL_QUESTION_COUNT;
  }

  function loadDefaultSourceText() {
    const defaultText = window.AiQuizService?.getDefaultQblSourceText?.() || "";
    if (defaultText && !els.sourceText.value.trim()) {
      els.sourceText.value = defaultText;
    }
  }

  function countWords(text) {
    return (String(text || "").match(/[A-Za-z0-9]+(?:[-'][A-Za-z0-9]+)*/g) || []).length;
  }

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function formatModelName(modelName) {
    return String(modelName || "Gemini")
      .replace(/^gemini-/i, "Gemini ")
      .replace(/-/g, " ")
      .replace(/\b\w/g, (char) => char.toUpperCase());
  }

  function clearStatus() {
    els.statusMessage.classList.remove("success");
    els.statusMessage.textContent = "";
  }

  function setLoading(percent, text) {
    const safePercent = Math.max(0, Math.min(100, percent));
    els.generationLoader.classList.remove("hidden");
    els.loadingText.textContent = text;
    els.loadingPercent.textContent = `${safePercent}%`;
    els.loadingBar.style.width = `${safePercent}%`;
    els.generationLoader.querySelector(".loader-track").setAttribute("aria-valuenow", String(safePercent));
  }

  function hideLoading() {
    els.generationLoader.classList.add("hidden");
    els.loadingText.textContent = "Preparing QBL";
    els.loadingPercent.textContent = "0%";
    els.loadingBar.style.width = "0%";
    els.generationLoader.querySelector(".loader-track").setAttribute("aria-valuenow", "0");
  }

  function pause(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  initializeAccessGate();
  renderMasteryCanvas();
})();

    </script>
  </body>
</html>
