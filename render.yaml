services:
  - type: web
    name: adaptive-quiz-studio
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite-preview
      - key: GEMINI_MODELS
        value: gemini-3.1-flash-lite-preview,gemini-2.5-flash,gemini-2.5-flash-lite
