<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Question Based Learning</title>
    <script>
      (() => {
        try {
          document.documentElement.dataset.theme = localStorage.getItem("adaptiveQuizTheme") || "light";
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="access-gate hidden" id="accessGate">
      <form class="access-card" id="accessForm">
        <h2>Access code</h2>
        <label for="accessCodeInput">Code</label>
        <input id="accessCodeInput" name="accessCode" type="password" autocomplete="current-password" />
        <p class="access-error" id="accessError" role="alert"></p>
        <button class="primary-button" id="accessSubmitButton" type="submit">Continue</button>
      </form>
    </div>

    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <h1>Question Based Learning</h1>
          <p class="app-subtitle">for Continuing Development Among Practising Dietitians</p>
        </div>
        <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false">
          <span class="theme-toggle-mark" aria-hidden="true"></span>
          <span id="themeToggleText">Dark mode</span>
        </button>
      </header>

      <main class="workspace">
        <section class="source-panel" aria-label="QBL setup">
          <p class="setup-note">The default content below can be replaced or edited</p>

          <div class="setup-fields">
            <label class="setup-field" for="courseDescription">
              <span class="field-label">Course description</span>
              <span class="field-helper" id="courseDescriptionHelp">Briefly describe the course, target group, and subject area.</span>
              <textarea
                class="setup-textarea setup-textarea-small"
                id="courseDescription"
                spellcheck="true"
                aria-describedby="courseDescriptionHelp"
              ></textarea>
            </label>

            <label class="setup-field" for="learningGoal">
              <span class="field-label">Learning goal</span>
              <span class="field-helper" id="learningGoalHelp">Describe what the learner should be able to do after the activity.</span>
              <textarea
                class="setup-textarea setup-textarea-small"
                id="learningGoal"
                spellcheck="true"
                aria-describedby="learningGoalHelp"
              ></textarea>
            </label>

            <label class="setup-field" for="selectedSkill">
              <span class="field-label">Selected skill</span>
              <span class="field-helper" id="selectedSkillHelp">Describe the specific skill that the questions should train.</span>
              <textarea
                class="setup-textarea setup-textarea-medium"
                id="selectedSkill"
                spellcheck="true"
                aria-describedby="selectedSkillHelp"
              ></textarea>
            </label>

            <label class="setup-field" for="sourceText">
              <span class="field-label">Source text</span>
              <span class="field-helper" id="sourceTextHelp">Paste the material that the knowledge bank and questions should be based on.</span>
              <textarea
                class="setup-textarea setup-textarea-large"
                id="sourceText"
                spellcheck="true"
                aria-describedby="sourceTextHelp"
                placeholder="Replace the example text with course notes, patient-data context, or instructor guidance."
              ></textarea>
            </label>
          </div>

          <div class="source-actions">
            <button class="primary-button" id="generateButton" type="button">Generate QBL</button>
            <button class="text-button" id="clearButton" type="button">Clear</button>
          </div>

          <div class="generation-loader hidden" id="generationLoader" aria-live="polite">
            <div class="loader-copy">
              <span id="loadingText">Preparing QBL</span>
              <strong id="loadingPercent">0%</strong>
            </div>
            <div class="loader-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <span id="loadingBar"></span>
            </div>
          </div>

          <p class="status-message" id="statusMessage" role="status" aria-live="polite"></p>
        </section>

        <section class="quiz-panel" aria-labelledby="quizTitle">
          <div class="panel-heading">
            <div>
              <h2 id="quizTitle">Questions</h2>
            </div>
            <button class="ghost-button hidden" id="editButton" type="button">Edit text</button>
          </div>

          <section class="knowledge-bank hidden" id="knowledgeBank" aria-label="Knowledge bank">
            <h3>Knowledge bank</h3>
            <p id="knowledgeBankText"></p>
          </section>

          <div class="empty-state" id="emptyState">
            <div class="empty-visual" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
            </div>
            <p>Questions appear here after the QBL setup is analyzed.</p>
          </div>

          <form id="quizForm" class="question-stack hidden"></form>

          <div class="quiz-actions hidden" id="quizActions">
            <div class="progress-wrap" aria-label="Answer progress">
              <span id="progressText">0 of 0 answered</span>
              <div class="progress-track">
                <span id="progressBar"></span>
              </div>
            </div>
            <div class="question-nav">
              <button class="ghost-button" id="prevQuestionButton" type="button">Previous</button>
              <button class="ghost-button" id="nextQuestionButton" type="button">Next</button>
              <button class="primary-button" id="submitButton" type="submit" form="quizForm" disabled>
                Finish round
              </button>
            </div>
          </div>

          <section class="report hidden" id="report" aria-label="Round results">
            <div class="report-heading">
              <strong id="reportScore"></strong>
            </div>
            <div id="feedbackList" class="feedback-list"></div>
            <div class="next-actions">
              <button class="primary-button hidden" id="nextRoundButton" type="button">Practice weak areas</button>
              <button class="ghost-button" id="restartButton" type="button">New quiz</button>
            </div>
          </section>
        </section>

        <div class="map-column">
          <div class="score-pill" aria-live="polite">
            <span id="roundLabel">Round 1</span>
          </div>

          <aside class="insight-panel" aria-label="Question map">
            <p class="weak-area-summary map-weak-summary hidden" id="weakAreaSummary"></p>

            <div class="map-snapshots hidden" id="mapSnapshots" aria-label="Completed round maps"></div>
            <canvas id="masteryCanvas" width="520" height="360" aria-label="Question map"></canvas>
          </aside>
        </div>
      </main>

      <footer class="app-footer">Created by Anton K</footer>
    </div>

    <script src="engine.js"></script>
    <script src="ai.js"></script>
    <script src="app.js"></script>
  </body>
</html>
